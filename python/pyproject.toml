[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moho-font"
version = "0.3.1"
description = "Arabic font catalog, provider URLs, filtering, and CSS utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MOHOAI" }]
keywords = ["arabic", "fonts", "typography", "google-fonts", "catalog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Fonts"
]

[project.urls]
Homepage = "https://github.com/MOHOAI/moho-font"
Repository = "https://github.com/MOHOAI/moho-font"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
